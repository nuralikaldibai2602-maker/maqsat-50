<!DOCTYPE html>
<html lang="kk" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Мақсат — 50 жас мерейтойына шақыру</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Google Fonts with Cyrillic Support -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,400;1,600&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
    
    <!-- Font Awesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        emeraldRoyal: '#06152C',
                        emeraldDeep: '#0B2244',
                        emeraldLight: '#133463',
                        goldPrimary: '#D4AF37',
                        goldLight: '#F3E5AB',
                        goldDark: '#AA8219',
                        ivoryBg: '#FAF6EE',
                        ivoryCard: '#FFFDF9',
                    },
                    fontFamily: {
                        serif: ['"Cormorant Garamond"', 'Georgia', 'serif'],
                        sans: ['"Montserrat"', 'sans-serif'],
                    }
                }
            }
        }
    </script>

    <style>
        body {
            background-color: #06152C;
            color: #2C2416;
            overflow-x: hidden;
            -webkit-tap-highlight-color: transparent;
        }

        .gold-gradient-text {
            background: linear-gradient(135deg, #BF953F 0%, #FCF6BA 35%, #B38728 70%, #FBF5B7 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-size: 200% auto;
            animation: shine 5s linear infinite;
        }

        .gold-border-glow {
            box-shadow: 0 0 25px rgba(212, 175, 55, 0.25), inset 0 0 15px rgba(212, 175, 55, 0.15);
        }

        .ivory-pattern-bg {
            background-color: #FAF6EE;
            background-image: radial-gradient(rgba(212, 175, 55, 0.14) 1px, transparent 1px),
                              radial-gradient(rgba(11, 34, 68, 0.05) 1px, #FAF6EE 1px);
            background-size: 36px 36px;
            background-position: 0 0, 18px 18px;
        }

        @keyframes shine {
            to {
                background-position: 200% center;
            }
        }

        @keyframes spinSlow {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        @keyframes pulseRing {
            0% { transform: scale(0.95); opacity: 0.8; }
            50% { transform: scale(1.08); opacity: 0.35; }
            100% { transform: scale(0.95); opacity: 0.8; }
        }

        @keyframes floatParticle {
            0%, 100% { transform: translateY(0px) translateX(0px); opacity: 0.2; }
            50% { transform: translateY(-20px) translateX(8px); opacity: 0.7; }
        }

        .animate-spin-slow {
            animation: spinSlow 10s linear infinite;
        }

        .animate-spin-paused {
            animation-play-state: paused;
        }

        .pulse-ring {
            animation: pulseRing 2.5s ease-in-out infinite;
        }

        .reveal {
            opacity: 0;
            transform: translateY(28px);
            transition: all 0.9s cubic-bezier(0.22, 1, 0.36, 1);
        }
        .reveal.active {
            opacity: 1;
            transform: translateY(0);
        }

        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #06152C;
        }
        ::-webkit-scrollbar-thumb {
            background: #D4AF37;
            border-radius: 9999px;
        }
    </style>
</head>
<body class="font-sans antialiased selection:bg-goldPrimary selection:text-emeraldRoyal">

    <!-- ==================== 1. WELCOME ENVELOPE / COVER OVERLAY ==================== -->
    <div id="coverOverlay" class="fixed inset-0 z-50 flex flex-col items-center justify-center bg-emeraldRoyal text-center px-6 transition-all duration-1000">
        <svg class="absolute top-4 left-4 w-20 h-20 sm:w-28 sm:h-28 text-goldPrimary opacity-70 pointer-events-none" viewBox="0 0 100 100" fill="none">
            <path d="M5 95V25C5 13.9543 13.9543 5 25 5H95" stroke="currentColor" stroke-width="2"/>
            <path d="M15 80V30C15 21.7157 21.7157 15 30 15H80" stroke="currentColor" stroke-width="1.2" stroke-dasharray="4 3"/>
            <path d="M22 45C22 32 32 22 45 22C38 28 36 36 42 42C48 48 56 46 62 39C62 52 52 62 39 62C30 62 22 54 22 45Z" fill="currentColor" opacity="0.85"/>
        </svg>
        <svg class="absolute top-4 right-4 w-20 h-20 sm:w-28 sm:h-28 text-goldPrimary opacity-70 transform rotate-90 pointer-events-none" viewBox="0 0 100 100" fill="none">
            <path d="M5 95V25C5 13.9543 13.9543 5 25 5H95" stroke="currentColor" stroke-width="2"/>
            <path d="M15 80V30C15 21.7157 21.7157 15 30 15H80" stroke="currentColor" stroke-width="1.2" stroke-dasharray="4 3"/>
            <path d="M22 45C22 32 32 22 45 22C38 28 36 36 42 42C48 48 56 46 62 39C62 52 52 62 39 62C30 62 22 54 22 45Z" fill="currentColor" opacity="0.85"/>
        </svg>
        <svg class="absolute bottom-4 left-4 w-20 h-20 sm:w-28 sm:h-28 text-goldPrimary opacity-70 transform -rotate-90 pointer-events-none" viewBox="0 0 100 100" fill="none">
            <path d="M5 95V25C5 13.9543 13.9543 5 25 5H95" stroke="currentColor" stroke-width="2"/>
            <path d="M15 80V30C15 21.7157 21.7157 15 30 15H80" stroke="currentColor" stroke-width="1.2" stroke-dasharray="4 3"/>
            <path d="M22 45C22 32 32 22 45 22C38 28 36 36 42 42C48 48 56 46 62 39C62 52 52 62 39 62C30 62 22 54 22 45Z" fill="currentColor" opacity="0.85"/>
        </svg>
        <svg class="absolute bottom-4 right-4 w-20 h-20 sm:w-28 sm:h-28 text-goldPrimary opacity-70 transform rotate-180 pointer-events-none" viewBox="0 0 100 100" fill="none">
            <path d="M5 95V25C5 13.9543 13.9543 5 25 5H95" stroke="currentColor" stroke-width="2"/>
            <path d="M15 80V30C15 21.7157 21.7157 15 30 15H80" stroke="currentColor" stroke-width="1.2" stroke-dasharray="4 3"/>
            <path d="M22 45C22 32 32 22 45 22C38 28 36 36 42 42C48 48 56 46 62 39C62 52 52 62 39 62C30 62 22 54 22 45Z" fill="currentColor" opacity="0.85"/>
        </svg>

        <div class="mb-6 relative pointer-events-none">
            <div class="absolute inset-0 rounded-full bg-goldPrimary/20 blur-xl"></div>
            <svg class="w-24 h-24 sm:w-28 sm:h-28 text-goldPrimary relative z-10" viewBox="0 0 120 120" fill="none">
                <circle cx="60" cy="60" r="54" stroke="currentColor" stroke-width="2.5"/>
                <circle cx="60" cy="60" r="46" stroke="currentColor" stroke-width="1" stroke-dasharray="3 3"/>
                <circle cx="60" cy="60" r="32" stroke="currentColor" stroke-width="2"/>
                <path d="M35 42C48 52 72 52 85 42" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                <path d="M32 60C48 66 72 66 88 60" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                <path d="M35 78C48 72 72 72 85 78" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                <path d="M42 35C52 48 52 72 42 85" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                <path d="M60 32C66 48 66 72 60 88" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                <path d="M78 35C72 48 72 72 78 85" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            </svg>
        </div>

        <p class="uppercase tracking-[0.3em] text-xs sm:text-sm text-goldLight/80 mb-2">Ақ дастарханға шақыру</p>
        <h1 class="font-serif text-4xl sm:text-6xl font-bold gold-gradient-text mb-3">Мақсат — 50 жас</h1>
        <p class="font-serif italic text-lg sm:text-2xl text-goldLight/90 mb-8 max-w-md">
            Құрметті қонағымыз болуға шақырамыз!
        </p>

        <button type="button" id="openInvitationBtn" class="group relative z-20 inline-flex items-center gap-3 px-8 py-4 rounded-full bg-gradient-to-r from-goldDark via-goldPrimary to-goldDark text-emeraldRoyal font-semibold tracking-wider uppercase text-sm sm:text-base shadow-[0_0_30px_rgba(212,175,55,0.5)] hover:scale-105 active:scale-95 transition-all duration-300 cursor-pointer touch-manipulation">
            <span class="absolute -inset-1 rounded-full border border-goldPrimary/60 pulse-ring pointer-events-none"></span>
            <i class="fa-solid fa-envelope-open-text text-lg pointer-events-none"></i>
            <span class="pointer-events-none">Шақыруды ашу</span>
        </button>
        
    </div>

    <!-- ==================== FLOATING MUSIC PLAYER BAR ==================== -->
    <div id="floatingMusicWidget" class="fixed bottom-4 right-4 left-4 sm:left-auto z-40 hidden items-center justify-end gap-2">
        <div class="bg-emeraldRoyal/95 backdrop-blur-md border border-goldPrimary/50 text-goldLight px-3.5 py-2 rounded-full shadow-[0_6px_25px_rgba(0,0,0,0.45)] flex items-center gap-2.5 sm:gap-3 max-w-full">
            <div class="text-left overflow-hidden">
                <p id="musicTitleDisplay" class="text-[11px] font-semibold text-goldPrimary truncate max-w-[140px] sm:max-w-[200px]">
                    Әкеден биік бар ма адам
                </p>
                <p id="musicTooltip" class="text-[10px] text-goldLight/80 truncate">
                    Әуен ойнап тұр
                </p>
            </div>

            <!-- Play / Pause Disc Button -->
            <button type="button" id="musicToggleBtn" aria-label="Әуенді қосу немесе өшіру" class="w-11 h-11 shrink-0 rounded-full bg-gradient-to-br from-goldLight via-goldPrimary to-goldDark text-emeraldRoyal shadow-[0_2px_12px_rgba(212,175,55,0.5)] border border-white/40 flex items-center justify-center cursor-pointer hover:scale-105 active:scale-95 transition-transform">
                <div id="musicDiscIcon" class="w-8 h-8 rounded-full border border-emeraldRoyal/40 flex items-center justify-center animate-spin-slow">
                    <i id="musicStateIcon" class="fa-solid fa-music text-sm"></i>
                </div>
            </button>
        </div>
    </div>

    <!-- GITHUB-КА ЖҮКТЕЛГЕН music.mp3 ФАЙЛЫ -->
    <audio id="backgroundAudio" src="music.mp3" loop preload="auto" playsinline></audio>

    <!-- ==================== MAIN INVITATION CONTAINER ==================== -->
    <main class="max-w-2xl mx-auto shadow-2xl overflow-hidden relative bg-ivoryBg">

        <!-- ==================== 2. HERO BANNER ==================== -->
        <section class="relative bg-gradient-to-b from-emeraldRoyal via-emeraldDeep to-emeraldRoyal text-center px-6 pt-14 pb-20 text-goldLight overflow-hidden">
            <div class="pointer-events-none absolute inset-0 overflow-hidden">
                <span class="absolute top-12 left-10 w-1.5 h-1.5 rounded-full bg-goldPrimary" style="animation: floatParticle 4s infinite ease-in-out;"></span>
                <span class="absolute top-28 right-12 w-2 h-2 rounded-full bg-goldLight" style="animation: floatParticle 5.5s infinite ease-in-out 1s;"></span>
                <span class="absolute bottom-24 left-16 w-1.5 h-1.5 rounded-full bg-goldPrimary" style="animation: floatParticle 4.8s infinite ease-in-out 0.5s;"></span>
                <span class="absolute top-1/2 right-8 w-1 h-1 rounded-full bg-goldLight" style="animation: floatParticle 6s infinite ease-in-out 2s;"></span>
            </div>

            <div class="flex justify-center mb-5">
                <svg class="w-64 sm:w-80 h-14 text-goldPrimary" viewBox="0 0 320 60" fill="none">
                    <path d="M10 50 C60 10, 260 10, 310 50" stroke="currentColor" stroke-width="1.5" opacity="0.6"/>
                    <path d="M160 8 C150 8, 142 16, 142 25 C142 32, 148 36, 153 33 C157 30, 155 24, 151 24 M160 8 C170 8, 178 16, 178 25 C178 32, 172 36, 167 33 C163 30, 165 24, 169 24" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
                    <path d="M125 22 C112 18, 100 24, 100 34 C100 41, 107 44, 111 40 C114 37, 111 32, 107 33" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
                    <path d="M195 22 C208 18, 220 24, 220 34 C220 41, 213 44, 209 40 C206 37, 209 32, 213 33" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
                    <circle cx="160" cy="40" r="3" fill="currentColor"/>
                    <circle cx="85" cy="36" r="2.5" fill="currentColor" opacity="0.8"/>
                    <circle cx="235" cy="36" r="2.5" fill="currentColor" opacity="0.8"/>
                </svg>
            </div>

            <p class="uppercase tracking-[0.35em] text-xs sm:text-sm text-goldLight/80 font-medium mb-4">
                Мерейтойға шақыру
            </p>

            <div class="relative inline-flex items-center justify-center my-3">
                <svg class="w-52 h-52 sm:w-64 sm:h-64 text-goldPrimary/85 animate-spin-slow" style="animation-duration: 38s;" viewBox="0 0 200 200" fill="none">
                    <circle cx="100" cy="100" r="94" stroke="currentColor" stroke-width="1.2" stroke-dasharray="6 4"/>
                    <circle cx="100" cy="100" r="84" stroke="currentColor" stroke-width="2"/>

                        <circle cx="100" cy="6" r="3.5"/>
                        <circle cx="100" cy="194" r="3.5"/>
                        <circle cx="6" cy="100" r="3.5"/>
                        <circle cx="194" cy="100" r="3.5"/>
                        <circle cx="33" cy="33" r="3"/>
                        <circle cx="167" cy="33" r="3"/>
                        <circle cx="33" cy="167" r="3"/>
                        <circle cx="167" cy="167" r="3"/>
                    </g>
                </svg>
                <div class="absolute
